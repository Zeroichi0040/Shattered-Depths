<!-- ==================== Shattered Depths - index.html ==================== -->
<!-- ==================== v0.1.0                        ==================== -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shattered Depths</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== Screen 1 : Main Menu ==================== -->
<section id="screen-menu" class="screen">
  <div class="panel">
    <h1 class="title">Shattered Depths</h1>
    <p class="subtitle">A turn-based dungeon crawler</p>

    <nav class="menu">
      <button class="menu-item" data-action="play">Play</button>
      <button class="menu-item" data-action="upgrades">Upgrades</button>
      <button class="menu-item" data-action="encyclopedia">Encyclopedia</button>
      <button class="menu-item" data-action="settings">Settings</button>
      <button class="menu-item" data-action="changelogs">Changelogs</button>
      <button class="menu-item" data-action="quit">Quit</button>
    </nav>

    <div class="credit">Made by Zeroichi</div>
  </div>
  <div class="panel-empty"></div>
</section>

<!-- ==================== Screen 2 : Play ==================== -->
<section id="screen-play" class="screen hidden">
  <div class="panel sidebar">
    <div class="player-head">
      <span class="player-sprite">👤</span>
      <span class="player-name">Player</span>
    </div>

    <div id="player-hp" class="stat">HP: 10 / 10</div>

    <div class="howto">
      <h2>How to Play</h2>
      <div>Move: WASD</div>
      <div>Attack: bump into enemy</div>
      <div>Wait: SPACE</div>
    </div>

    <button id="menu-btn" class="menu-item">MENU</button>
  </div>

  <div class="game-area">
    <div class="board">
      <div id="debug" class="debug"></div>
      <div id="grid" class="grid"></div>
    </div>
  </div>
</section>

<!-- ==================== Screen 3 : Changelog ==================== -->
<section id="screen-changelog" class="screen hidden">
  <div class="changelog-page">
    <h1 class="title">Changelog</h1>
    <div id="changelog-list" class="changelog-list"></div>
    <button id="changelog-back" class="menu-item">&larr; Back</button>
  </div>
</section>

<!-- ==================== Floating UI ==================== -->
<div id="toast" class="toast" aria-live="polite"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <p>Close the tab to quit.</p>
    <button id="modal-close" class="menu-item">OK</button>
  </div>
</div>

<div id="overlay" class="overlay hidden"><div id="overlay-text"></div></div>

<script src="changelog.js"></script>
<script src="game.js"></script>
</body>
</html>
